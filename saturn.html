<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Big Planetarium - Saturn</title>
    <!-- links the global style sheet for the site -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Big Planetarium</h1>
        <!-- links to navigate through all solar system pages -->
        <nav>
            <a href="index.html">Home</a>
            <a href="mars.html">Mars</a>
            <a href="jupiter.html">Jupiter</a>
            <a href="saturn.html">Saturn</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Saturn</h2>
        <p>Saturn is the sixth planet from the sun and is famous for its beautiful ring system.</p>

        <!-- grid container for saturn media and content -->
        <section class="gallery">
            <!-- video section with manual playback control button -->
            <div class="item">
                <video>
                    <source src="media/saturnvideo.mp4" type="video/mp4">
                    Your browser is not supported
                </video>
                <button onclick="toggleMedia(this)">Play / Pause</button>
                <p>Saturn clip</p>
            </div>

            <!-- static planet image with accessibility alt text -->
            <div class="item">
                <img src="images/saturn.jpg" alt="A photo of Saturn">
                <p>Saturn image</p>
            </div>

            <!-- audio section with manual playback control button -->
            <div class="item">
                <audio>
                    <source src="media/saturnsound.mp3" type="audio/mpeg">
                    Your browser is not supported
                </audio>
                <button onclick="toggleMedia(this)">Play / Pause</button>
                <p>Saturn audio</p>
            </div>
        </section>

        <!-- container for the interactive saturn fact generator -->
        <div class="interaction-container">
            <button onclick="showFact()">Click for a Saturn Fact!</button>
            <p id="fact-display">Click the button to learn something new!</p>
        </div>
    </main>

    <footer>
        <!-- semantic footer for copyright and branding -->
        <p>&copy; 2026 Big Planetarium</p>
    </footer>

    <!-- script for interactive site features and media logic -->
    <script>
        // list of specific facts about the planet saturn
        const facts = [
            "Saturn is the second-largest planet in the solar system.",
            "Its rings are made mostly of billions of particles of ice and rock.",
            "Saturn has a hexagonal storm at its north pole.",
            "Saturn is the least dense planet in our solar system."
        ];

        // function to choose and show random saturn facts
        function showFact() {
            const randomIndex = Math.floor(Math.random() * facts.length);
            const factDisplay = document.getElementById("fact-display");
            factDisplay.innerHTML = facts[randomIndex];
        }

        // function to toggle media between play and pause
        function toggleMedia(btn) {
            const media = btn.previousElementSibling;
            if (media.paused) {
                media.play();
            } else {
                media.pause();
            }
        }
    </script>

</body>

</html>
