<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Big Planetarium - Mars</title>
    <!-- defines relationship with external css file -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Big Planetarium</h1>
        <!-- internal links to navigate the solar system -->
        <nav>
            <a href="index.html">Home</a>
            <a href="mars.html">Mars</a>
            <a href="jupiter.html">Jupiter</a>
            <a href="saturn.html">Saturn</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Mars</h2>
        <p>Mars is the fourth planet from the sun and the second smallest planet in the solar system.</p>

        <!-- grid container for mars media content -->
        <section class="gallery">
            <!-- video player with manual play pause button -->
            <div class="item">
                <video>
                    <source src="media/marsvideo.mp4" type="video/mp4">
                </video>
                <button onclick="toggleMedia(this)">Play / Pause</button>
                <p>Mars clip</p>
            </div>

            <!-- planetary image with descriptive alt text -->
            <div class="item">
                <img src="images/mars.jpg" alt="A photo of Mars">
                <p>Mars image</p>
            </div>

            <!-- audio player with manual play pause button -->
            <div class="item">
                <audio>
                    <source src="media/marssound.mp3" type="audio/mpeg">
                </audio>
                <button onclick="toggleMedia(this)">Play / Pause</button>
                <p>Mars audio</p>
            </div>
        </section>

        <!-- section for the dynamic mars fact generator -->
        <div class="interaction-container">
            <button onclick="showFact()">Click for a Mars Fact!</button>
            <p id="fact-display">Click the button to learn something new!</p>
        </div>
    </main>

    <footer>
        <!-- semantic footer for the website owner -->
        <p>&copy; 2026 Big Planetarium</p>
    </footer>

    <!-- javascript for interactive content and media logic -->
    <script>
        // array containing several facts about the red planet
        const facts = [
            "Mars is often called the Red Planet because of the iron oxide on its surface.",
            "Mars has two small moons named Phobos and Deimos.",
            "The largest volcano in the solar system, Olympus Mons, is on Mars.",
            "A day on Mars is just slightly longer than a day on Earth."
        ];

        // logic to display a random fact to users
        function showFact() {
            const randomIndex = Math.floor(Math.random() * facts.length);
            const factDisplay = document.getElementById("fact-display");
            factDisplay.innerHTML = facts[randomIndex];
        }

        // controls playback of both video and audio files
        function toggleMedia(btn) {
            const media = btn.previousElementSibling;
            if (media.paused) {
                media.play();
            } else {
                media.pause();
            }
        }
    </script>

</body>

</html>
