<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Big Planetarium - Jupiter</title>
    <!-- connects to the shared style sheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Big Planetarium</h1>
        <!-- main navigation for the whole site -->
        <nav>
            <a href="index.html">Home</a>
            <a href="mars.html">Mars</a>
            <a href="jupiter.html">Jupiter</a>
            <a href="saturn.html">Saturn</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Jupiter</h2>
        <p>Jupiter is the largest planet in our solar system, a gas giant with a great red spot.</p>

        <!-- grid layout for jupiter media assets -->
        <section class="gallery">
            <!-- video component with manual toggle button -->
            <div class="item">
                <video>
                    <source src="media/jupitervideo.mp4" type="video/mp4">
                    Your browser is not supported
                </video>
                <button onclick="toggleMedia(this)">Play / Pause</button>
                <p>Jupiter clip</p>
            </div>

            <!-- static image with accessibility alt text -->
            <div class="item">
                <img src="images/jupiter.jpg" alt="A photo of Jupiter">
                <p>Jupiter image</p>
            </div>

            <!-- audio component with manual toggle button -->
            <div class="item">
                <audio>
                    <source src="media/jupitersound.mp3" type="audio/mpeg">
                    Your browser is not supported
                </audio>
                <button onclick="toggleMedia(this)">Play / Pause</button>
                <p>Jupiter audio</p>
            </div>
        </section>

        <!-- container for the interactive fact generator -->
        <div class="interaction-container">
            <button onclick="showFact()">Click for a Jupiter Fact!</button>
            <p id="fact-display">Click the button to learn something new!</p>
        </div>
    </main>

    <footer>
        <!-- footer showing the current project year -->
        <p>&copy; 2026 Big Planetarium</p>
    </footer>

    <!-- logic for interactions and media playback -->
    <script>
        // array containing specific facts about jupiter
        const facts = [
            "Jupiter is the largest planet in our solar system.",
            "The Great Red Spot is a giant storm that has been raging for hundreds of years.",
            "Jupiter has more than 90 known moons.",
            "Because it is a gas giant, Jupiter has no solid surface."
        ];

        // function to select and display jupiter facts
        function showFact() {
            const randomIndex = Math.floor(Math.random() * facts.length);
            const factDisplay = document.getElementById("fact-display");
            factDisplay.innerHTML = facts[randomIndex];
        }

        // function to control video and audio playback
        function toggleMedia(btn) {
            const media = btn.previousElementSibling;
            if (media.paused) {
                media.play();
            } else {
                media.pause();
            }
        }
    </script>

</body>

</html>
